<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 2: Điền nốt nhạc</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Times New Roman', Times, serif; 
            background-color: #D5E5F2; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        .sidebar { 
            width: 80px; background-color: #1A2B5F; display: flex; 
            flex-direction: column; justify-content: flex-end; 
            align-items: center; padding-bottom: 20px; z-index: 10;
        }

        .content { 
            flex-grow: 1; padding: 40px; overflow-y: auto; 
            display: flex; flex-direction: column; 
        }

        .back-btn { 
            text-decoration: none; color: #D00; font-family: sans-serif; 
            font-weight: bold; margin-bottom: 20px; display: inline-block; 
        }
        h2 { color: #1A2B5F; font-size: 32px; margin-bottom: 10px; }
        p { font-size: 18px; color: #333; line-height: 1.5; margin-bottom: 20px; }

        /* --- Bố cục 2 cột mới --- */
        .exercise-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start; /* Giữ các khối ở sát phía trên */
            margin-bottom: 20px;
        }

        /* --- Khu vực Bảng bài tập (Cột trái) --- */
        .board-area {
            flex: 1; /* Chiếm toàn bộ phần không gian còn lại */
            background: white; border-radius: 20px; padding: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 15px;
        }

        .grid-row { display: flex; align-items: center; gap: 8px; justify-content: center; }

        .cell {
            width: 65px; height: 50px; border: 1px solid #999; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; font-size: 18px; background: #fff;
            color: black; text-transform: uppercase; border-radius: 4px;
        }

        .cell.static { background: #e0e0e0; color: #555; border-color: #888; }

        .cell.empty-box {
            border: 2px dashed #1A2B5F; background: #F0F5FA; 
            cursor: pointer; transition: 0.2s; color: #1A2B5F;
        }
        .cell.empty-box:hover { background: #D5E5F2; }

        .cell.empty-box.active {
            border: 3px solid #D00; background: #fff5f5; 
            box-shadow: 0 0 8px rgba(221, 0, 0, 0.3); transform: scale(1.05);
        }

        .cell.correct { background-color: #d4edda; border-color: #28a745; color: #155724; border-style: solid; }
        .cell.incorrect { background-color: #f8d7da; border-color: #dc3545; color: #721c24; border-style: solid; animation: shake 0.4s; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        /* --- Bảng Nhập liệu (Cột phải) --- */
        .controls-area {
            width: 250px; /* Độ rộng cố định cho bảng công cụ bên phải */
            flex-shrink: 0;
            background: white; padding: 20px; border-radius: 15px; 
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            position: sticky; top: 0; /* Ghim cố định khi cuộn màn hình */
        }

        .palette { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; 
        }

        .note-btn {
            width: 55px; height: 55px; border-radius: 50%; background-color: white; 
            border: 3px solid #1A2B5F; color: #1A2B5F; font-weight: bold; 
            font-size: 16px; font-family: sans-serif; cursor: pointer; transition: 0.2s;
        }

        .note-btn:hover { background-color: #1A2B5F; color: white; transform: scale(1.1); }
        .note-btn:active { transform: scale(0.95); }

        .btn-group { 
            display: flex; flex-direction: column; gap: 10px; margin-top: 10px; 
        }
        .action-btn {
            width: 100%; padding: 12px 15px; font-size: 16px; margin: 0;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
            font-weight: bold;
        }
        #checkBtn { background: #D00; color: white; }
        #checkBtn:hover { background: #a00; }
        #resetBtn { background: #ddd; color: #333; }
        #resetBtn:hover { background: #bbb; }

        /* Tối ưu cho thiết bị màn hình nhỏ (Điện thoại) */
        @media (max-width: 900px) {
            .exercise-layout { flex-direction: column; }
            .controls-area { width: 100%; position: static; }
            .btn-group { flex-direction: row; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div style="color: white; font-weight: bold;">Khóa Sol</div>
    </aside>

    <main class="content">
        <div>
            <a href="exercises.html" class="back-btn">← Quay lại</a>
            <h2>Bài tập số 2</h2>
            <p>Điền tên nốt nhạc theo thứ tự vòng tuần hoàn vào ô trống. <br>
               <b>Hướng dẫn:</b> Nhấp vào một ô trống đang chớp đỏ, sau đó chọn nốt nhạc ở bảng điều khiển bên phải để điền.</p>
        </div>

        <!-- Layout 2 cột -->
        <div class="exercise-layout">
            <div class="board-area" id="gridContainer">
                <!-- Dữ liệu các hàng sẽ được Javascript tạo tự động ở đây -->
            </div>

            <div class="controls-area">
                <h3 style="margin-bottom: 15px; color: #1A2B5F;">Bảng điền nốt</h3>
                <div class="palette">
                    <button class="note-btn">ĐÔ</button>
                    <button class="note-btn">RÊ</button>
                    <button class="note-btn">MI</button>
                    <button class="note-btn">FA</button>
                    <button class="note-btn">SON</button>
                    <button class="note-btn">LA</button>
                    <button class="note-btn">SI</button>
                </div>
                
                <div class="btn-group">
                    <button id="resetBtn" class="action-btn">Đề mới & Làm lại</button>
                    <button id="checkBtn" class="action-btn">Kiểm tra kết quả</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SCALE = ['ĐÔ', 'RÊ', 'MI', 'FA', 'SON', 'LA', 'SI'];
            let currentQuestions = [];
            const gridContainer = document.getElementById('gridContainer');
            const noteBtns = document.querySelectorAll('.note-btn');
            const checkBtn = document.getElementById('checkBtn');
            const resetBtn = document.getElementById('resetBtn');
            let activeBox = null;

            function generateRandomQuestions(numRows = 7, cellsPerRow = 8) {
                currentQuestions = [];
                let startIndices = Array.from({length: SCALE.length}, (_, i) => i);
                
                for (let i = startIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [startIndices[i], startIndices[j]] = [startIndices[j], startIndices[i]];
                }
                
                for (let r = 0; r < numRows; r++) {
                    let startIdx = startIndices[r];
                    let rowData = [];       
                    let expectedData = [];  

                    for (let i = 0; i < cellsPerRow; i++) {
                        expectedData.push(SCALE[(startIdx + i) % SCALE.length]);
                    }

                    let keepIndices = new Set();
                    while(keepIndices.size < 3) {
                        keepIndices.add(Math.floor(Math.random() * cellsPerRow));
                    }

                    for (let i = 0; i < cellsPerRow; i++) {
                        if (keepIndices.has(i)) {
                            rowData.push(expectedData[i]);
                        } else {
                            rowData.push(null);
                        }
                    }

                    currentQuestions.push({ data: rowData, expected: expectedData });
                }
            }

            function renderGrid() {
                gridContainer.innerHTML = '';
                currentQuestions.forEach((q, rowIndex) => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'grid-row';

                    q.data.forEach((note, colIndex) => {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        
                        if (note !== null) {
                            cell.classList.add('static');
                            cell.innerText = note;
                        } else {
                            cell.classList.add('empty-box');
                            cell.dataset.row = rowIndex;
                            cell.dataset.col = colIndex;
                            cell.addEventListener('click', () => selectBox(cell));
                        }
                        rowDiv.appendChild(cell);
                    });
                    gridContainer.appendChild(rowDiv);
                });

                const firstEmpty = document.querySelector('.empty-box');
                if (firstEmpty) selectBox(firstEmpty);
            }

            function selectBox(cellElement) {
                if (activeBox) activeBox.classList.remove('active');
                activeBox = cellElement;
                activeBox.classList.add('active');
                activeBox.classList.remove('correct', 'incorrect');
            }

            noteBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!activeBox) return; 
                    
                    activeBox.innerText = btn.innerText;
                    activeBox.classList.remove('correct', 'incorrect');

                    const emptyBoxes = Array.from(document.querySelectorAll('.empty-box'));
                    const currentIndex = emptyBoxes.indexOf(activeBox);
                    
                    if (currentIndex >= 0 && currentIndex < emptyBoxes.length - 1) {
                        selectBox(emptyBoxes[currentIndex + 1]);
                    } else {
                        activeBox.classList.remove('active');
                        activeBox = null;
                    }
                });
            });

            checkBtn.addEventListener('click', () => {
                let isAllCorrect = true;
                currentQuestions.forEach((q, rowIndex) => {
                    const emptyBoxesInRow = document.querySelectorAll(`.empty-box[data-row="${rowIndex}"]`);
                    emptyBoxesInRow.forEach(box => {
                        const colIndex = parseInt(box.dataset.col);
                        const expectedNote = q.expected[colIndex];
                        const userNote = box.innerText;

                        box.classList.remove('correct', 'incorrect');

                        if (userNote === expectedNote) {
                            box.classList.add('correct');
                        } else if (userNote !== '') { 
                            box.classList.add('incorrect');
                            isAllCorrect = false;
                        } else {
                            isAllCorrect = false; 
                        }
                    });
                });

                if (isAllCorrect) {
                    setTimeout(() => alert("Tuyệt đỉnh! Bạn đã điền chính xác tất cả các nốt nhạc!"), 300);
                }
            });

            resetBtn.addEventListener('click', () => {
                generateRandomQuestions();
                renderGrid(); 
            });

            generateRandomQuestions();
            renderGrid();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 6: Nhận diện nốt nhạc</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Times New Roman', Times, serif; 
            background-color: #D5E5F2; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        .sidebar { 
            width: 80px; background-color: #1A2B5F; display: flex; 
            flex-direction: column; justify-content: flex-end; 
            align-items: center; padding-bottom: 20px; z-index: 10;
        }

        .content { 
            flex-grow: 1; padding: 40px; overflow-y: auto; 
            display: flex; flex-direction: column; 
            position: relative;
        }

        .back-btn { 
            text-decoration: none; color: #D00; font-family: sans-serif; 
            font-weight: bold; margin-bottom: 20px; display: inline-block; 
        }
        h2 { color: #1A2B5F; font-size: 32px; margin-bottom: 10px; }
        p { font-size: 18px; color: #333; line-height: 1.5; margin-bottom: 20px; }

        .exercise-layout { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }

        /* --- Khu vực Khuông nhạc --- */
        .board-area {
            flex: 1;
            background: white; border-radius: 20px; padding: 40px 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 400px;
            position: relative;
        }

        /* Nút Cài đặt */
        .settings-btn {
            position: absolute; top: 20px; right: 25px;
            background: #F0F5FA; border: 2px solid #1A2B5F; border-radius: 8px;
            font-size: 24px; cursor: pointer; padding: 5px 10px;
            color: #1A2B5F; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .settings-btn span { font-size: 14px; font-family: sans-serif; font-weight: bold; }
        .settings-btn:hover { background: #1A2B5F; color: white; }

        .staff-wrapper {
            display: flex; align-items: center; justify-content: center;
            width: 100%; gap: 30px;
        }

        /* KHUÔNG NHẠC CHUẨN TOÁN HỌC */
        .staff-box {
            position: relative;
            width: 100%; max-width: 400px;
            height: 96px; 
            margin: 100px 0; 
        }

        .clef-symbol {
            position: absolute;
            left: 10px; 
            bottom: -22px; 
            font-size: 110px;
            line-height: 1;
            font-family: 'Times New Roman', serif;
            color: #000;
            z-index: 3;
        }

        .staff-lines {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 1;
        }
        
        .staff-lines .line { height: 2px; background-color: #000; width: 100%; }

        #noteCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
        }

        /* Dòng kẻ phụ (Ledger Lines) */
        .ledger-line {
            position: absolute;
            width: 44px; height: 2px;
            background-color: #000;
            left: 163px; 
            transform: translateY(1px); 
        }

        /* TỔ HỢP NỐT NHẠC */
        .note-event {
            position: absolute;
            left: 170px;
            height: 0px; 
            display: flex;
            align-items: center; 
            overflow: visible;
        }

        .accidental {
            font-family: 'Times New Roman', serif;
            color: #000;
            font-weight: bold;
            margin-right: 8px; 
            line-height: 0; 
            display: flex; align-items: center;
        }
        
        .accidental.flat { font-size: 46px; margin-top: -12px; } 
        .accidental.sharp { font-size: 38px; margin-top: -2px; } 
        .accidental.natural { font-size: 38px; margin-top: -2px; } 

        .note-head {
            position: relative;
            width: 30px; height: 20px; 
            background-color: #000; 
            border-radius: 50%;
            transform: rotate(-15deg); 
        }

        /* --- ICON KẾT QUẢ --- */
        .result-icon {
            width: 50px; height: 50px; font-size: 55px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-icon.correct { color: #28a745; opacity: 1; transform: scale(1); }
        .result-icon.incorrect { color: #dc3545; opacity: 1; transform: scale(1); }

        /* --- BẢNG NHẬP LIỆU BÊN PHẢI --- */
        .controls-area {
            width: 320px; flex-shrink: 0;
            background: white; padding: 20px; border-radius: 15px; 
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }
        
        .section-title { font-size: 14px; color: #666; text-transform: uppercase; margin-bottom: 10px; font-family: sans-serif; }

        .mod-palette { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .mod-btn {
            width: 60px; height: 50px; border-radius: 8px; background-color: #F0F5FA; 
            border: 2px solid #1A2B5F; color: #1A2B5F; font-weight: bold; 
            font-size: 26px; font-family: serif; cursor: pointer; transition: 0.2s;
        }
        .mod-btn:hover:not(:disabled) { background-color: #D5E5F2; }
        .mod-btn.active { background-color: #1A2B5F; color: white; border-color: #D00; transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .mod-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #ccc; }

        .note-palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .note-btn {
            width: 65px; height: 55px; border-radius: 8px; background-color: #fff; 
            border: 2px solid #ccc; color: #333; font-weight: bold; 
            font-size: 18px; font-family: sans-serif; cursor: pointer; transition: 0.2s;
        }
        .note-btn:hover { border-color: #1A2B5F; background-color: #f9f9f9; transform: translateY(-2px); }
        
        .note-btn.flash-correct { background-color: #28a745 !important; color: white !important; border-color: #28a745 !important; }
        .note-btn.flash-incorrect { background-color: #dc3545 !important; color: white !important; border-color: #dc3545 !important; animation: shake 0.4s; }

        /* --- MODAL CÀI ĐẶT --- */
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-family: sans-serif;
        }
        .modal-header {
            font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #1A2B5F;
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { cursor: pointer; color: #999; font-size: 28px; line-height: 24px; transition: 0.2s; }
        .close-btn:hover { color: #D00; }
        
        .setting-group { margin-bottom: 25px; }
        .setting-title { font-weight: bold; margin-bottom: 12px; color: #333; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        
        /* Cấu trúc mới cho phần Phạm vi (Giống image_0ba6ed) */
        .slider-container {
            display: flex; justify-content: center; align-items: center; margin-top: 15px; position: relative; gap: 40px;
        }
        
        /* Trục ngang mô phỏng khuông nhạc Mini */
        .mini-staff {
            position: relative; width: 60px; height: 180px; margin: 0 20px;
        }
        .mini-staff .line {
            width: 100%; height: 2px; background: #000; position: absolute; left: 0;
        }
        .mini-staff .line:nth-child(1) { top: 60px; }
        .mini-staff .line:nth-child(2) { top: 75px; }
        .mini-staff .line:nth-child(3) { top: 90px; }
        .mini-staff .line:nth-child(4) { top: 105px; }
        .mini-staff .line:nth-child(5) { top: 120px; }
        
        /* Dòng kẻ phụ trên Mini Staff */
        .mini-ledger {
            position: absolute; width: 40px; height: 2px; background: #000; left: 10px;
        }
        
        /* Nút kéo (Thumb) - 2 điểm đen */
        .thumb {
            width: 24px; height: 16px; background: #000; border-radius: 50%;
            position: absolute; left: 18px; cursor: pointer; transform: rotate(-15deg);
            z-index: 10;
        }
        .thumb-top { top: 15px; } 
        .thumb-bottom { top: 165px; } 
        
        /* Đường nối giữa 2 thumb */
        .range-line {
            position: absolute; left: 29px; width: 2px; background: rgba(26, 43, 95, 0.5); z-index: 5;
            top: 22px; height: 136px;
        }

        /* Khu vực Nút bấm trái/phải */
        .control-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .control-col label { font-size: 14px; color: #555; margin-bottom: 5px; }
        .val-display { font-size: 18px; font-weight: bold; width: 40px; text-align: center; }
        .arrow-btn { 
            width: 40px; height: 35px; background: #F0F5FA; border: 1px solid #ccc; 
            border-radius: 5px; cursor: pointer; font-size: 16px; 
        }
        .arrow-btn:hover { background: #D5E5F2; }

        .setting-row { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .setting-row input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; accent-color: #1A2B5F; cursor: pointer; }
        .setting-row label { cursor: pointer; font-size: 16px; color: #444; }

        .save-btn {
            width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: white;
            background: #D00; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .save-btn:hover { background: #a00; }

        @keyframes shake {
            0% { transform: translateY(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 900px) {
            .exercise-layout { flex-direction: column; }
            .controls-area { width: 100%; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div style="color: white; font-weight: bold;">Khóa Sol</div>
    </aside>

    <main class="content">
        <div>
            <a href="exercises.html" class="back-btn">← Quay lại</a>
            <h2>Bài tập 6: Nhận diện Nốt nhạc</h2>
            <p>Hệ thống sẽ hiển thị một nốt nhạc ngẫu nhiên. Hãy chọn <b>Dấu hóa</b> và bấm vào <b>Tên nốt</b> để trả lời!</p>
        </div>

        <div class="exercise-layout">
            <div class="board-area">
                <button class="settings-btn" id="openSettingsBtn">⚙️ <span>Cài đặt</span></button>
                
                <div class="staff-wrapper">
                    <div class="staff-box">
                        <div class="clef-symbol">&#119070;</div>
                        
                        <div class="staff-lines">
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                        
                        <div id="noteCanvas"></div>
                    </div>
                    
                    <div id="resultIcon" class="result-icon"></div>
                </div>
            </div>

            <div class="controls-area">
                <div class="section-title">1. Chọn dấu hóa</div>
                <div class="mod-palette">
                    <button class="mod-btn" data-mod="flat" title="Giáng">&#9837;</button>
                    <button class="mod-btn active" data-mod="natural" title="Bình (Không dấu)">&#9838;</button>
                    <button class="mod-btn" data-mod="sharp" title="Thăng">&#9839;</button>
                </div>
                
                <div class="section-title">2. Chọn tên nốt (Chốt đáp án)</div>
                <div class="note-palette">
                    <button class="note-btn" data-val="ĐÔ">C</button>
                    <button class="note-btn" data-val="RÊ">D</button>
                    <button class="note-btn" data-val="MI">E</button>
                    <button class="note-btn" data-val="FA">F</button>
                    <button class="note-btn" data-val="SON">G</button>
                    <button class="note-btn" data-val="LA">A</button>
                    <button class="note-btn" data-val="SI">B</button>
                </div>
            </div>
        </div>

        <!-- MODAL CÀI ĐẶT -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    Tùy chỉnh Bài tập
                    <span class="close-btn" id="closeSettingsBtn">&times;</span>
                </div>
                
                <div class="setting-group">
                    <div class="setting-title">Phạm vi nốt nhạc (Tầm vực)</div>
                    
                    <div class="slider-container">
                        <!-- Cột điều khiển trên -->
                        <div class="control-col">
                            <label>Giới hạn trên</label>
                            <button class="arrow-btn" id="upTopBtn">▲</button>
                            <div class="val-display" id="topValDisplay">12</div>
                            <button class="arrow-btn" id="downTopBtn">▼</button>
                        </div>
                        
                        <!-- Mô phỏng Slider dọc -->
                        <div class="mini-staff" id="miniStaff">
                            <!-- JS sẽ vẽ động 5 dòng và các dòng kẻ phụ vào đây -->
                            <div class="range-line" id="rangeLine"></div>
                            <div class="thumb thumb-top" id="thumbTop"></div>
                            <div class="thumb thumb-bottom" id="thumbBottom"></div>
                        </div>
                        
                        <!-- Cột điều khiển dưới -->
                        <div class="control-col">
                            <label>Giới hạn dưới</label>
                            <button class="arrow-btn" id="upBotBtn">▲</button>
                            <div class="val-display" id="botValDisplay">-4</div>
                            <button class="arrow-btn" id="downBotBtn">▼</button>
                        </div>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-title">Loại dấu hóa</div>
                    <label class="setting-row">
                        <input type="checkbox" id="accNatural" checked>
                        <span>&#9838; Bình (Không dấu)</span>
                    </label>
                    <label class="setting-row">
                        <input type="checkbox" id="accFlat" checked>
                        <span>&#9837; Giáng</span>
                    </label>
                    <label class="setting-row">
                        <input type="checkbox" id="accSharp" checked>
                        <span>&#9839; Thăng</span>
                    </label>
                </div>

                <button class="save-btn" id="saveSettingsBtn">Lưu & Bắt đầu lại</button>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // TỪ ĐIỂN TỌA ĐỘ NỐT NHẠC (Khóa Sol)
            const NOTES_MAP = [
                { pos: -4, name: 'LA' }, { pos: -3, name: 'SI' }, { pos: -2, name: 'ĐÔ' }, 
                { pos: -1, name: 'RÊ' }, { pos: 0,  name: 'MI' }, { pos: 1,  name: 'FA' }, 
                { pos: 2,  name: 'SON' }, { pos: 3,  name: 'LA' }, { pos: 4,  name: 'SI' }, 
                { pos: 5,  name: 'ĐÔ' }, { pos: 6,  name: 'RÊ' }, { pos: 7,  name: 'MI' }, 
                { pos: 8,  name: 'FA' }, { pos: 9,  name: 'SON' }, { pos: 10, name: 'LA' }, 
                { pos: 11, name: 'SI' }, { pos: 12, name: 'ĐÔ' }
            ];
            
            const ACC_SYMBOLS = { 'flat': '&#9837;', 'natural': '&#9838;', 'sharp': '&#9839;' };

            // Trạng thái hệ thống
            let currentQuestion = null;
            let currentMod = 'natural'; 
            let isLocked = false;
            
            // Cấu hình hiện tại (Khởi tạo Max Range từ -4 đến 12)
            let config = {
                range: { min: -4, max: 12 },
                acc: { natural: true, flat: true, sharp: true }
            };

            const noteCanvas = document.getElementById('noteCanvas');
            const resultIcon = document.getElementById('resultIcon');
            const modBtns = document.querySelectorAll('.mod-btn');
            const noteBtns = document.querySelectorAll('.note-btn');

            // --- QUẢN LÝ CÀI ĐẶT ---
            const modal = document.getElementById('settingsModal');
            document.getElementById('openSettingsBtn').addEventListener('click', () => modal.style.display = 'flex');
            document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.style.display = 'none');
            
            // Logic UI cho thanh trượt
            let tempMin = config.range.min;
            let tempMax = config.range.max;
            
            const miniStaff = document.getElementById('miniStaff');
            const rangeLine = document.getElementById('rangeLine');
            const thumbTop = document.getElementById('thumbTop');
            const thumbBottom = document.getElementById('thumbBottom');

            function updateSliderUI() {
                if(tempMin > tempMax) tempMin = tempMax;
                if(tempMax < tempMin) tempMax = tempMin;
                
                document.getElementById('botValDisplay').innerText = tempMin;
                document.getElementById('topValDisplay').innerText = tempMax;
                
                // Trục Y của Mini Staff: Dòng 1 (pos 0) nằm ở 120px. Mỗi pos cách nhau 7.5px.
                const topPx = 120 - (tempMax * 7.5);
                const botPx = 120 - (tempMin * 7.5);
                
                // Vẽ lại khuông nhạc mini và các dòng kẻ phụ
                miniStaff.innerHTML = `
                    <div class="line" style="top: 60px;"></div>
                    <div class="line" style="top: 75px;"></div>
                    <div class="line" style="top: 90px;"></div>
                    <div class="line" style="top: 105px;"></div>
                    <div class="line" style="top: 120px;"></div>
                `;

                // Vẽ dòng kẻ phụ trên nếu nốt Top >= 10
                if (tempMax >= 10) {
                    for (let p = 10; p <= tempMax; p += 2) {
                        miniStaff.innerHTML += `<div class="mini-ledger" style="top: ${120 - (p * 7.5)}px;"></div>`;
                    }
                }
                
                // Vẽ dòng kẻ phụ dưới nếu nốt Bottom <= -2
                if (tempMin <= -2) {
                    for (let p = -2; p >= tempMin; p -= 2) {
                        miniStaff.innerHTML += `<div class="mini-ledger" style="top: ${120 - (p * 7.5)}px;"></div>`;
                    }
                }

                // Gắn lại Thumb và Range Line vì đã xóa innerHTML
                miniStaff.appendChild(rangeLine);
                miniStaff.appendChild(thumbTop);
                miniStaff.appendChild(thumbBottom);

                // Cập nhật vị trí
                thumbTop.style.top = (topPx - 8) + 'px'; // -8 để căn giữa nốt
                thumbBottom.style.top = (botPx - 8) + 'px';
                
                rangeLine.style.top = topPx + 'px';
                rangeLine.style.height = (botPx - topPx) + 'px';
            }

            document.getElementById('upTopBtn').addEventListener('click', () => { if(tempMax < 12) tempMax++; updateSliderUI(); });
            document.getElementById('downTopBtn').addEventListener('click', () => { if(tempMax > tempMin) tempMax--; updateSliderUI(); });
            document.getElementById('upBotBtn').addEventListener('click', () => { if(tempMin < tempMax) tempMin++; updateSliderUI(); });
            document.getElementById('downBotBtn').addEventListener('click', () => { if(tempMin > -4) tempMin--; updateSliderUI(); });
            
            updateSliderUI();

            document.getElementById('saveSettingsBtn').addEventListener('click', () => {
                const aNat = document.getElementById('accNatural').checked;
                const aFlat = document.getElementById('accFlat').checked;
                const aSharp = document.getElementById('accSharp').checked;

                if (!aNat && !aFlat && !aSharp) {
                    alert("Bạn phải chọn ít nhất một loại dấu hóa!");
                    return;
                }

                config.range.min = tempMin;
                config.range.max = tempMax;
                config.acc = { natural: aNat, flat: aFlat, sharp: aSharp };
                
                modal.style.display = 'none';
                applyConfigToUI();
                generateQuestion();
            });

            function applyConfigToUI() {
                modBtns.forEach(btn => {
                    const type = btn.dataset.mod;
                    btn.disabled = !config.acc[type];
                });
            }

            // --- CORE LOGIC ---
            function generateQuestion() {
                isLocked = false;
                resultIcon.className = 'result-icon';
                resultIcon.innerHTML = '';
                
                if (config.acc.natural) setMod('natural');
                else if (config.acc.flat) setMod('flat');
                else if (config.acc.sharp) setMod('sharp');

                let validNotes = NOTES_MAP.filter(n => n.pos >= config.range.min && n.pos <= config.range.max);

                let validAccs = [];
                if (config.acc.natural) validAccs.push('natural');
                if (config.acc.flat) validAccs.push('flat');
                if (config.acc.sharp) validAccs.push('sharp');

                const randomNote = validNotes[Math.floor(Math.random() * validNotes.length)];
                const randomAcc = validAccs[Math.floor(Math.random() * validAccs.length)];

                currentQuestion = {
                    pos: randomNote.pos,
                    name: randomNote.name,
                    accidental: randomAcc
                };

                renderNote(currentQuestion);
            }

            function renderNote(question) {
                noteCanvas.innerHTML = ''; 
                const bottomPx = question.pos * 12; 
                
                if (question.pos <= -2) {
                    for (let p = -2; p >= question.pos; p -= 2) {
                        noteCanvas.innerHTML += `<div class="ledger-line" style="bottom: ${p * 12}px;"></div>`;
                    }
                }
                if (question.pos >= 10) {
                    for (let p = 10; p <= question.pos; p += 2) {
                        noteCanvas.innerHTML += `<div class="ledger-line" style="bottom: ${p * 12}px;"></div>`;
                    }
                }

                let displaySymbol = ACC_SYMBOLS[question.accidental];
                if (question.accidental === 'natural' && Math.random() > 0.5) {
                    displaySymbol = ''; 
                }

                const noteEventHtml = `
                    <div class="note-event" style="bottom: ${bottomPx}px;">
                        <div class="accidental ${question.accidental}">${displaySymbol}</div>
                        <div class="note-head"></div>
                    </div>
                `;
                noteCanvas.innerHTML += noteEventHtml;
            }

            function setMod(modType) {
                currentMod = modType;
                modBtns.forEach(b => b.classList.remove('active'));
                const btn = document.querySelector(`.mod-btn[data-mod="${modType}"]`);
                if(btn && !btn.disabled) btn.classList.add('active');
            }

            modBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isLocked || btn.disabled) return;
                    setMod(btn.dataset.mod);
                });
            });

            noteBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isLocked) return;

                    const userNote = btn.dataset.val;
                    const isCorrect = (userNote === currentQuestion.name) && (currentMod === currentQuestion.accidental);

                    noteBtns.forEach(b => b.classList.remove('flash-correct', 'flash-incorrect'));

                    if (isCorrect) {
                        isLocked = true; 
                        btn.classList.add('flash-correct');
                        resultIcon.innerHTML = '✔';
                        resultIcon.className = 'result-icon correct';
                        
                        setTimeout(generateQuestion, 1200); 
                    } else {
                        btn.classList.add('flash-incorrect');
                        resultIcon.innerHTML = '✖';
                        resultIcon.className = 'result-icon incorrect';
                        
                        setTimeout(() => btn.classList.remove('flash-incorrect'), 800);
                    }
                });
            });

            const KEY_MAP = { 'C': 'ĐÔ', 'D': 'RÊ', 'E': 'MI', 'F': 'FA', 'G': 'SON', 'A': 'LA', 'B': 'SI' };
            document.addEventListener('keydown', (e) => {
                if (isLocked) return;
                const key = e.key.toUpperCase();
                if (KEY_MAP[key]) {
                    const targetBtn = document.querySelector(`.note-btn[data-val="${KEY_MAP[key]}"]`);
                    if (targetBtn) targetBtn.click();
                }
            });

            applyConfigToUI();
            generateQuestion();
        });
    </script>
</body>
</html>

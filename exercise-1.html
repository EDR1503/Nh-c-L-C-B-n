<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 1: Tìm đường đi</title>
    <style>
        /* --- Giao diện tổng thể --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Times New Roman', Times, serif; 
            background-color: #D5E5F2; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        .sidebar { 
            width: 80px; background-color: #1A2B5F; display: flex; 
            flex-direction: column; justify-content: flex-end; 
            align-items: center; padding-bottom: 20px; z-index: 10;
        }

        .content { 
            flex-grow: 1; padding: 40px; overflow-y: auto; 
            display: flex; flex-direction: column; 
        }

        .back-btn { 
            text-decoration: none; color: #D00; font-family: sans-serif; 
            font-weight: bold; margin-bottom: 20px; display: inline-block; 
        }
        h2 { color: #1A2B5F; font-size: 32px; margin-bottom: 10px; }
        p { font-size: 18px; color: #333; line-height: 1.5; margin-bottom: 20px; }

        /* --- Khu vực đồ thị --- */
        .graph-area { 
            background: white; border-radius: 20px; padding: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; 
            align-items: center; justify-content: space-between; 
            position: relative; min-height: 500px; margin-bottom: 20px; 
        }
        .point-text { 
            font-weight: bold; font-size: 35px; color: black; 
            text-align: center; z-index: 10; width: 60px;
        }
        
        .nodes-container { 
            position: relative; flex-grow: 1; height: 450px; 
            margin: 0 20px;
        }

        /* Canvas dùng để vẽ các đường kẻ nối ngã ba, ngã tư */
        #linesCanvas {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; z-index: 1;
        }

        /* --- Nút bấm Nốt nhạc --- */
        .music-node {
            position: absolute; width: 55px; height: 55px; 
            border-radius: 50%; background-color: white; 
            border: 2px solid black; color: black;
            font-weight: bold; font-size: 16px; font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; z-index: 2; 
            transform: translate(-50%, -50%); /* Đưa tâm node vào đúng tọa độ x,y */
        }
        
        .music-node:hover { 
            transform: translate(-50%, -50%) scale(1.15); 
            background-color: #e0f0ff; box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        
        .music-node.selected { 
            background-color: #1A2B5F; color: white; border-color: #D00; 
        }
        
        .music-node.error { 
            background-color: #ffcccc; border-color: #D00; color: #D00;
            animation: shake 0.4s; 
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) translateX(0); }
            25% { transform: translate(-50%, -50%) translateX(-5px); }
            50% { transform: translate(-50%, -50%) translateX(5px); }
            75% { transform: translate(-50%, -50%) translateX(-5px); }
            100% { transform: translate(-50%, -50%) translateX(0); }
        }

        /* --- Bảng trạng thái --- */
        .status-board { 
            background: white; padding: 20px; border-radius: 15px; 
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }
        .path-highlight { 
            color: #D00; font-weight: bold; font-size: 24px; 
            font-family: sans-serif; display: block; margin: 10px 0; min-height: 30px; 
        }
        .btn-group button {
            padding: 10px 20px; font-size: 16px; margin: 0 10px;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
            font-weight: bold;
        }
        #resetBtn { background: #1A2B5F; color: white; }
        #resetBtn:hover { background: #D00; }
        #undoBtn { background: #ddd; color: #333; }
        #undoBtn:hover { background: #bbb; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div style="color: white; font-weight: bold;">Khóa Sol</div>
    </aside>

    <main class="content">
        <div>
            <a href="exercises.html" class="back-btn">← Quay lại</a>
            <h2>Bài tập số 1</h2>
            <p>Đường đi từ điểm A đến điểm B qua các ngã ba, ngã tư được đánh dấu theo thứ tự tên nốt nhạc <b>(ĐÔ → RÊ → MI → FA → SON → LA → SI)</b>. <br>Lưu ý: Chỉ được đi qua các đường có nối nét kẻ. Hãy tìm đúng đường đi!</p>
        </div>

        <div class="graph-area">
            <div class="point-text">A<br><span style="font-size:16px;font-weight:normal">→</span></div>
            
            <div class="nodes-container" id="nodesContainer">
                <canvas id="linesCanvas"></canvas>
                <div id="nodesUI"></div>
            </div>

            <div class="point-text">B<br><span style="font-size:16px;font-weight:normal">→</span></div>
        </div>

        <div class="status-board">
            <p style="margin-bottom: 5px; font-size: 20px;">Đường đi hiện tại:</p>
            <span id="currentPathStr" class="path-highlight">Chưa bắt đầu</span>
            <div class="btn-group">
                <button id="undoBtn">Hoàn tác bước trước</button>
                <button id="resetBtn">Tạo sơ đồ mới & Chơi lại</button>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SCALE = ['ĐÔ', 'RÊ', 'MI', 'FA', 'SON', 'LA', 'SI'];
            let currentPathNodes = []; 
            let nodesData = []; 
            let edgesData = []; 

            const nodesUI = document.getElementById('nodesUI');
            const canvas = document.getElementById('linesCanvas');
            const ctx = canvas.getContext('2d');
            const currentPathStr = document.getElementById('currentPathStr');
            const resetBtn = document.getElementById('resetBtn');
            const undoBtn = document.getElementById('undoBtn');

            // Quay trở lại lưới tọa độ 26 điểm xếp đan xen, nhồi nhét để tạo hình tổ nhện
            const layoutGrid = [
                { id: 1, x: 5, y: 50 },
                { id: 2, x: 15, y: 20 }, { id: 3, x: 15, y: 50 }, { id: 4, x: 15, y: 80 },
                { id: 5, x: 28, y: 10 }, { id: 6, x: 28, y: 35 }, { id: 7, x: 28, y: 65 }, { id: 8, x: 28, y: 90 },
                { id: 9, x: 40, y: 20 }, { id: 10, x: 40, y: 50 }, { id: 11, x: 40, y: 80 },
                { id: 12, x: 52, y: 10 }, { id: 13, x: 52, y: 35 }, { id: 14, x: 52, y: 65 }, { id: 15, x: 52, y: 90 },
                { id: 16, x: 65, y: 20 }, { id: 17, x: 65, y: 50 }, { id: 18, x: 65, y: 80 },
                { id: 19, x: 78, y: 10 }, { id: 20, x: 78, y: 35 }, { id: 21, x: 78, y: 65 }, { id: 22, x: 78, y: 90 },
                { id: 23, x: 90, y: 20 }, { id: 24, x: 90, y: 50 }, { id: 25, x: 90, y: 80 },
                { id: 26, x: 98, y: 50 }
            ];

            function generateRandomGraph() {
                // 1. Phủ nốt nhạc ngẫu nhiên lên toàn bộ để ngụy trang
                nodesData = layoutGrid.map(pos => ({
                    ...pos,
                    note: SCALE[Math.floor(Math.random() * SCALE.length)]
                }));

                // 2. Các đường dẫn vàng dích dắc dài đúng 15 bước (để khớp với vòng tuần hoàn về ĐÔ)
                const goldenPaths = [
                    [1, 3, 2, 5, 6, 9, 10, 13, 17, 18, 21, 20, 23, 24, 26],
                    [1, 4, 3, 7, 8, 11, 10, 14, 15, 18, 21, 22, 25, 24, 26],
                    [1, 2, 3, 6, 7, 10, 9, 12, 13, 16, 17, 20, 21, 24, 26]
                ];
                
                const selectedPath = goldenPaths[Math.floor(Math.random() * goldenPaths.length)];

                // 3. Ép đường dẫn vàng tuân thủ âm giai
                for (let i = 0; i < selectedPath.length; i++) {
                    const nodeId = selectedPath[i];
                    const node = nodesData.find(n => n.id === nodeId);
                    node.note = SCALE[i % 7]; 
                }

                // KHÓA CHẾT TÌNH HUỐNG: Đảm bảo điểm A (id:1) và điểm B (id:26) luôn hiển thị ĐÔ 
                // dù việc random có xảy ra sai sót nào đi chăng nữa.
                nodesData.find(n => n.id === 1).note = 'ĐÔ';
                nodesData.find(n => n.id === 26).note = 'ĐÔ';

                // 4. Tạo các nét vẽ kết nối
                edgesData = [];
                
                // Trải các nét vẽ ngẫu nhiên đan xen chằng chịt
                for (let i = 0; i < nodesData.length; i++) {
                    for (let j = i + 1; j < nodesData.length; j++) {
                        let n1 = nodesData[i];
                        let n2 = nodesData[j];
                        if (Math.abs(n1.x - n2.x) <= 15 && Math.abs(n1.y - n2.y) <= 35) {
                            // Bỏ bớt 20% số đường nối để đồ thị không bị đen kịt, trông giống sách hơn
                            if (Math.random() > 0.2) {
                                edgesData.push({ a: n1.id, b: n2.id });
                            }
                        }
                    }
                }

                // Đảm bảo đường dẫn vàng luôn có nét đứt nối thông nhau
                for (let i = 0; i < selectedPath.length - 1; i++) {
                    let a = selectedPath[i];
                    let b = selectedPath[i+1];
                    let hasEdge = edgesData.some(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
                    if (!hasEdge) {
                        edgesData.push({ a: a, b: b });
                    }
                }
            }

            function drawEdges() {
                const container = document.getElementById('nodesContainer');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#222'; 

                edgesData.forEach(edge => {
                    const n1 = nodesData.find(n => n.id === edge.a);
                    const n2 = nodesData.find(n => n.id === edge.b);
                    
                    const x1 = (n1.x / 100) * canvas.width;
                    const y1 = (n1.y / 100) * canvas.height;
                    const x2 = (n2.x / 100) * canvas.width;
                    const y2 = (n2.y / 100) * canvas.height;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                });
            }

            function renderNodesUI() {
                nodesUI.innerHTML = '';
                nodesData.forEach(node => {
                    const btn = document.createElement('div');
                    btn.className = 'music-node';
                    btn.id = 'node-' + node.id;
                    btn.innerText = node.note;
                    btn.style.left = `${node.x}%`;
                    btn.style.top = `${node.y}%`;
                    
                    btn.addEventListener('click', () => handleNodeClick(node, btn));
                    nodesUI.appendChild(btn);
                });
                updateStatusBoard();
            }

            function isConnected(node1, node2) {
                return edgesData.some(e => (e.a === node1.id && e.b === node2.id) || (e.a === node2.id && e.b === node1.id));
            }

            function handleNodeClick(clickedNode, btnElement) {
                if (currentPathNodes.some(n => n.id === clickedNode.id)) return;

                let expectedNote = SCALE[currentPathNodes.length % SCALE.length];

                if (currentPathNodes.length === 0) {
                    // Bắt buộc node đầu tiên click phải là A (id=1) và chữ ĐÔ
                    if (clickedNode.id === 1 && clickedNode.note === 'ĐÔ') {
                        acceptNode(clickedNode, btnElement);
                    } else {
                        rejectNode(btnElement);
                    }
                    return;
                }

                let lastNode = currentPathNodes[currentPathNodes.length - 1];
                if (isConnected(lastNode, clickedNode) && clickedNode.note === expectedNote) {
                    acceptNode(clickedNode, btnElement);
                } else {
                    rejectNode(btnElement);
                }
            }

            function acceptNode(nodeData, btnElement) {
                btnElement.classList.add('selected');
                currentPathNodes.push(nodeData);
                updateStatusBoard();

                // Chiến thắng khi chạm đích B (id=26)
                if (nodeData.id === 26) {
                    setTimeout(() => alert("Hoàn hảo! Bạn đã tìm ra đường đi trọn vẹn và trở về âm chủ ĐÔ!"), 200);
                }
            }

            function rejectNode(btnElement) {
                btnElement.classList.add('error');
                setTimeout(() => btnElement.classList.remove('error'), 400);
            }

            function updateStatusBoard() {
                if (currentPathNodes.length === 0) {
                    currentPathStr.innerText = 'Chưa bắt đầu';
                } else {
                    currentPathStr.innerText = currentPathNodes.map(n => n.note).join(' → ');
                }
            }

            undoBtn.addEventListener('click', () => {
                if (currentPathNodes.length > 0) {
                    let lastNode = currentPathNodes.pop();
                    let btn = document.getElementById('node-' + lastNode.id);
                    if (btn) btn.classList.remove('selected');
                    updateStatusBoard();
                }
            });

            resetBtn.addEventListener('click', () => {
                currentPathNodes = [];
                generateRandomGraph();
                drawEdges();
                renderNodesUI();
            });

            window.addEventListener('resize', drawEdges);

            generateRandomGraph();
            drawEdges();
            renderNodesUI();
        });
    </script>

</body>
</html>
